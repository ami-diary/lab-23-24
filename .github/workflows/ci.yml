name: CI - FinalSurge UI Tests

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "UI Tests on ${{ matrix.browser }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # ВАЖНО: Убрали установку браузеров! На GitHub Ubuntu они уже есть.
      - name: 🧪 Run tests on ${{ matrix.browser }}
        run: |
          echo "=== Запуск тестов на ${{ matrix.browser }} ==="
          # Просто запускаем тесты
          mvn -B clean test \
            -Dselenide.browser=${{ matrix.browser }} \
            -Dheadless=true \
            -Dwebdriver.chrome.driver=/usr/bin/chromedriver \
            -Dwebdriver.gecko.driver=/usr/bin/geckodriver

      # Временно УБРАЛИ генерацию и загрузку артефактов
      # Сначала убедимся, что тесты вообще запускаются
